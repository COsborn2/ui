version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "fix"
      include: "scope"
    # Each update joins the first group it matches, so families that must move
    # together come first and the catch-all comes last. A breaking release then
    # holds back only its own family instead of every pending update.
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
      radix:
        patterns: ["@radix-ui/*"]
        update-types: ["minor", "patch"]
      storybook:
        patterns: ["storybook", "@storybook/*"]
        update-types: ["minor", "patch"]
      vite-and-vitest:
        # The browser test runner drives Playwright, so its version moves with Vitest.
        patterns: ["vite", "@vitejs/*", "vitest", "@vitest/*", "playwright"]
        update-types: ["minor", "patch"]
      lint-and-types:
        # Tooling that only affects lint and typecheck, kept apart so it never
        # holds back library fixes.
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "@types/*"
        update-types: ["minor", "patch"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Keep static icons server-compatible. New Lucide releases require a
      # deliberate compatibility review, including patch releases.
      - dependency-name: "lucide-react"
        versions: ["*"]
    open-pull-requests-limit: 10
    # Wait out the window in which broken or compromised releases are usually
    # caught. Longer than bunfig.toml's 3-day minimumReleaseAge, so regenerated
    # lockfiles always clear Bun's gate.
    cooldown:
      default-days: 4
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "chore(ci)"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    # Same delay as package updates.
    cooldown:
      default-days: 4

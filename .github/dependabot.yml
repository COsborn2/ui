version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "fix"
      include: "scope"
    # Each update joins the first group it matches, so families that must move
    # together come first and the catch-all comes last. A breaking release then
    # holds back only its own family instead of every pending update.
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
      radix:
        patterns: ["@radix-ui/*"]
        update-types: ["minor", "patch"]
      # Dev-tooling families whose packages only work at matching majors take
      # every update type, so a major lands as one PR instead of several that
      # each fail alone.
      storybook:
        patterns: ["storybook", "@storybook/*"]
      vite-and-vitest:
        # The browser test runner drives Playwright, so its version moves with Vitest.
        patterns: ["vite", "@vitejs/*", "vitest", "@vitest/*", "playwright"]
      lint-and-types:
        # Tooling that only affects lint and typecheck, kept apart so it never
        # holds back library fixes.
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "@types/*"
        update-types: ["minor", "patch"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # New Lucide releases require a deliberate compatibility review, including
      # patch releases: 1.x removed brand icons and renders every icon as a
      # client component, so check removals and rendering boundaries.
      - dependency-name: "lucide-react"
        versions: ["*"]
    open-pull-requests-limit: 10
    # Wait out the window in which broken or compromised releases are usually
    # caught. Longer than bunfig.toml's 3-day minimumReleaseAge, so regenerated
    # lockfiles always clear Bun's gate.
    cooldown:
      default-days: 4
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "chore(ci)"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      # Action majors need review either way; one PR keeps them to one
      # review and one branch update.
      majors:
        update-types: ["major"]
    open-pull-requests-limit: 5
    # Same delay as package updates.
    cooldown:
      default-days: 4

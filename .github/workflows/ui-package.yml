name: UI Package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Preview release intent without publishing
        run: bun run release:preview
      - run: bun run build
      - name: Install Chromium headless shell
        run: bunx playwright install --only-shell chromium
      - name: React unit and Storybook interaction/accessibility tests
        run: bun run test
      - name: Build component documentation
        run: bun run build-storybook
      - name: Check npm package contents and exports
        run: bun run check:package
      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

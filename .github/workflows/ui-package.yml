name: UI Package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run audit:dependencies
      - run: bun run lint
      - name: Preview release intent without publishing
        run: bun run release:preview
      - run: bun run build
      - name: Install Storybook browser
        run: bunx playwright install --with-deps chromium
      - name: React unit and Storybook interaction/accessibility tests
        run: bun run test
      - name: Build component documentation
        run: bun run build-storybook
      - name: Check npm package contents and exports
        run: bun run check:package
      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storybook-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

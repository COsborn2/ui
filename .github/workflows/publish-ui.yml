name: Publish UI Package

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version already committed in package.json'
        required: true
        type: string
      channel:
        description: 'npm distribution tag'
        required: true
        type: choice
        default: beta
        options: [beta, latest]

permissions:
  contents: read

concurrency:
  group: publish-cosborn2-ui
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.UI_NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Decide whether the committed version needs publishing
        id: release
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.channel }}
        run: bun scripts/decide-release.ts
      - run: bun install --frozen-lockfile
        if: steps.release.outputs.should_publish == 'true'
      - run: bun run lint
        if: steps.release.outputs.should_publish == 'true'
      - run: bun run build
        if: steps.release.outputs.should_publish == 'true'
      - run: bun run test
        if: steps.release.outputs.should_publish == 'true'
      - name: Install Chromium
        if: steps.release.outputs.should_publish == 'true'
        run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
        if: steps.release.outputs.should_publish == 'true'
      - name: Publish using npm trusted publishing
        if: steps.release.outputs.should_publish == 'true'
        env:
          DIST_TAG: ${{ steps.release.outputs.channel }}
          # npm supports OIDC for private repositories, but provenance requires
          # public source. Keep publishing valid if repository visibility changes.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.visibility == 'public' }}
        run: npm publish --access public --tag "$DIST_TAG"

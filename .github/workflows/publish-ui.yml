name: Publish UI Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize automatic releases and retries across the one maintained line.
concurrency:
  group: publish-cosborn2-ui
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.UI_NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - name: Install Chromium headless shell
        run: bunx playwright install --only-shell chromium
      - name: React unit and Storybook interaction/accessibility tests
        run: bun run test
      - run: bun run build-storybook
      - run: bun run check:package
      - name: Publish and tag the next beta or stable patch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OIDC handles npm authentication; no npm token is needed.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.visibility == 'public' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bun scripts/release.ts
      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

name: Publish UI Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize automatic releases and retries across the one maintained line.
concurrency:
  group: publish-cosborn2-ui
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.UI_NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run audit:dependencies
      - run: bun run lint
      - run: bun run build
      - name: Install Storybook browser
        run: bunx playwright install --with-deps chromium
      - name: React unit and Storybook interaction/accessibility tests
        run: bun run test
      - run: bun run build-storybook
      - run: bun run check:package
      - name: Publish and tag the next beta or stable patch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OIDC handles npm authentication; no npm token is needed.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.visibility == 'public' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bun scripts/release.ts
      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storybook-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
